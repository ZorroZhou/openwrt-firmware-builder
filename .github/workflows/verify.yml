name: Verify firmware builds

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'configs/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'configs/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: latest
            target: x86/64
            profile: generic
            proxy: openclash
          - version: previous
            target: x86/64
            profile: generic
            proxy: nikki
            docker: 'true'
          - version: latest
            target: x86/64
            profile: generic
            proxy: none
            istore: 'true'
          - version: latest
            target: armsr/armv8
            profile: generic
            proxy: openclash
          - version: previous
            target: armsr/armv8
            profile: generic
            proxy: nikki
          - version: latest
            target: armsr/armv8
            profile: generic
            proxy: none
            docker: 'true'
          - version: latest
            target: ath79/generic
            profile: tplink_archer-c7-v5
            proxy: none
            size: auto
          - version: latest
            target: armsr/armv8
            profile: generic
            proxy: none
            istore: 'true'
    env:
      OPENWRT_VERSION: ${{ matrix.version }}
      OPENWRT_TARGET: ${{ matrix.target }}
      PROFILE: ${{ matrix.profile }}
      ISTORE: ${{ matrix.istore || 'false' }}
      ROOTFS_MB: ${{ matrix.size || '512' }}
      PRESET: standard
      PROXY: ${{ matrix.proxy }}
      DOCKER: ${{ matrix.docker || 'false' }}
      # Synthetic address for disposable, isolated CI guests; not a deployed device.
      LAN_IP: '192.168.77.1'
      EXTRA_PACKAGES: 'htop'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Workflow purpose and help
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'WORKFLOW_HELP'
          ## Verify firmware builds：开发验收

          相关代码变更后自动运行单元测试和代表性平台/插件构建检查。测试固件与日志只用于验收，不发布 Release；通过不代表官网所有硬件已完成实机验证。

          此段是用途说明，任务是否成功请查看本次运行状态及后续步骤。

          [查看全部流程说明](https://github.com/ZorroZhou/openwrt-firmware-builder#actions-流程说明)
          WORKFLOW_HELP
      - name: Test and validate inputs
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --validate-only
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip file wget curl python3 zstd xz-utils
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-user
      - name: Build and check images
        run: python3 -u scripts/build.py 2>&1 | tee build.log
      - name: Validate on the supported emulator; record the coverage scope
        run: python3 -u scripts/smoke.py
      - name: Save verified images
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ strategy.job-index }}-${{ matrix.version }}-${{ matrix.proxy }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ strategy.job-index }}-${{ matrix.version }}-${{ matrix.proxy }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            smoke.log
          if-no-files-found: ignore
          retention-days: 7
