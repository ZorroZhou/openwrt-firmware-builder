name: Verify firmware builds

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'configs/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'configs/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [latest, previous, third]
        proxy: [none, openclash, nikki]
        exclude:
          - version: third
            proxy: nikki
        include:
          - version: latest
            proxy: none
            docker: 'true'
          - version: previous
            proxy: nikki
            docker: 'true'
          - version: third
            proxy: none
            docker: 'true'
          - version: '25.12.0'
            proxy: none
          - version: '24.10.0'
            proxy: none
          - version: '23.05.0'
            proxy: none
    env:
      OPENWRT_VERSION: ${{ matrix.version }}
      OPENWRT_TARGET: x86-64
      ROOTFS_MB: '512'
      PRESET: standard
      PROXY: ${{ matrix.proxy }}
      DOCKER: ${{ matrix.docker || 'false' }}
      LAN_IP: '192.168.77.1'
      EXTRA_PACKAGES: 'htop'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test and validate inputs
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --validate-only
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip file wget curl python3 zstd xz-utils
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build and check images
        run: python3 -u scripts/build.py 2>&1 | tee build.log
      - name: Boot isolated BIOS image and check installed features
        run: python3 -u scripts/smoke.py
      - name: Save verified images
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.version }}-${{ matrix.proxy }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.version }}-${{ matrix.proxy }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            smoke.log
          if-no-files-found: ignore
          retention-days: 7
