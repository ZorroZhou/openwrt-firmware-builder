name: Build OpenWrt
run-name: OpenWrt ${{ inputs.version }} / ${{ inputs.preset }} / ${{ inputs.rootfs_mb }} MiB

on:
  workflow_dispatch:
    inputs:
      version:
        description: '官网最新三代的全部正式小版本（刷新方法见 README）'
        type: choice
        required: true
        options:
          - '25.12.6'
          - '25.12.5'
          - '25.12.4'
          - '25.12.3'
          - '25.12.2'
          - '25.12.1'
          - '25.12.0'
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
          - '23.05.6'
          - '23.05.5'
          - '23.05.4'
          - '23.05.3'
          - '23.05.2'
          - '23.05.1'
          - '23.05.0'
        default: '25.12.6'
      target:
        description: 目标平台
        type: choice
        options: [x86-64]
        default: x86-64
      rootfs_mb:
        description: 根分区大小（MiB，不是压缩文件大小）
        type: choice
        options: ['256', '512', '1024', '2048', '4096']
        default: '1024'
      preset:
        description: 'minimal=官方基础包；standard=中文 LuCI HTTPS + curl（推荐）'
        type: choice
        options: [minimal, standard]
        default: standard
      lan_ip:
        description: '管理 IPv4（默认 192.168.1.1；私网主机地址，固定 /24；运行前校验）'
        type: string
        default: ''
      docker:
        description: 预装 Docker 和中文 Dockerman 管理界面（至少 512 MiB）
        type: boolean
        default: false
      proxy:
        description: '中文代理管理插件及核心（Nikki 不支持 23；首次启动保持关闭）'
        type: choice
        options: [none, openclash, nikki]
        default: none
      extra_packages:
        description: '额外官方包（可留空；包名速查及示例见仓库 docs/PACKAGES.md）'
        type: string
        default: ''
      publish_release:
        description: 构建验证通过后发布 GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.firmware.outputs.artifact-id }}
    env:
      OPENWRT_VERSION: ${{ inputs.version }}
      OPENWRT_TARGET: ${{ inputs.target }}
      ROOTFS_MB: ${{ inputs.rootfs_mb }}
      PRESET: ${{ inputs.preset }}
      LAN_IP: ${{ inputs.lan_ip }}
      DOCKER: ${{ inputs.docker }}
      PROXY: ${{ inputs.proxy }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and run regression tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --validate-only
      - name: Install ImageBuilder host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip file wget curl python3 zstd xz-utils
      - name: Download, verify and build
        id: builder
        run: python3 -u scripts/build.py 2>&1 | tee build.log
      - name: Upload verified firmware
        id: firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.builder.outputs.version }}-x86-64-${{ inputs.proxy }}-${{ inputs.rootfs_mb }}MiB-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
