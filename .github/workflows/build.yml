name: Build OpenWrt
run-name: OpenWrt ${{ inputs.version }} / ${{ inputs.preset }} / ${{ inputs.rootfs_mb }} MiB

on:
  workflow_dispatch:
    inputs:
      version:
        description: '官网最新两代的全部正式小版本（刷新方法见 README）'
        type: choice
        required: true
        options:
          - '25.12.6'
          - '25.12.5'
          - '25.12.4'
          - '25.12.3'
          - '25.12.2'
          - '25.12.1'
          - '25.12.0'
          - '24.10.8'
          - '24.10.7'
          - '24.10.6'
          - '24.10.5'
          - '24.10.4'
          - '24.10.3'
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
        default: '25.12.6'
      target:
        description: 官方 target/subtarget；运行 Discover official devices 查找
        type: string
        default: x86/64
      profile:
        description: 官方设备 Profile ID；必须与版本和目标匹配
        type: string
        default: generic
      rootfs_mb:
        description: 磁盘根分区 MiB；固定闪存设备必须选 auto
        type: choice
        options: ['auto', '256', '512', '1024', '2048', '4096']
        default: 'auto'
      preset:
        description: 'minimal=官方基础包；standard=中文 LuCI HTTPS + curl（推荐）'
        type: choice
        options: [minimal, standard]
        default: standard
      lan_ip:
        description: '管理 IPv4（默认 192.168.1.1；私网主机地址，固定 /24；运行前校验）'
        type: string
        default: ''
      router_mode:
        description: 主路由提供 LAN DHCP；旁路由关闭 LAN DHCP/IPv6 通告
        type: choice
        options: [main, bypass]
        default: main
      upstream_gateway:
        description: 旁路由必填，同一管理网段的主路由 IPv4；主路由模式留空
        type: string
        default: ''
      upstream_dns:
        description: 旁路由必填，DNS IPv4，以空格分隔；主路由模式留空
        type: string
        default: ''
      istore:
        description: 可选 iStore（目前仅验收 25.12 APK 的 x86_64/arm64 签名源）
        type: boolean
        default: false
      docker:
        description: 预装 Docker 和中文 Dockerman 管理界面（至少 512 MiB）
        type: boolean
        default: false
      proxy:
        description: '中文代理管理插件及核心（按实际架构/分支匹配；首次启动保持关闭）'
        type: choice
        options: [none, openclash, nikki]
        default: none
      extra_packages:
        description: '额外官方包（可留空；包名速查及示例见仓库 docs/PACKAGES.md）'
        type: string
        default: ''
      publish_release:
        description: 构建验证通过后发布 GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.firmware.outputs.artifact-id }}
    env:
      OPENWRT_VERSION: ${{ inputs.version }}
      OPENWRT_TARGET: ${{ inputs.target }}
      PROFILE: ${{ inputs.profile }}
      ROUTER_MODE: ${{ inputs.router_mode }}
      UPSTREAM_GATEWAY: ${{ inputs.upstream_gateway }}
      UPSTREAM_DNS: ${{ inputs.upstream_dns }}
      ISTORE: ${{ inputs.istore }}
      ROOTFS_MB: ${{ inputs.rootfs_mb }}
      PRESET: ${{ inputs.preset }}
      LAN_IP: ${{ inputs.lan_ip }}
      DOCKER: ${{ inputs.docker }}
      PROXY: ${{ inputs.proxy }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and run regression tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --validate-only
      - name: Install ImageBuilder host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip file wget curl python3 zstd xz-utils
      - name: Download, verify and build
        id: builder
        run: python3 -u scripts/build.py 2>&1 | tee build.log
      - name: Validate runtime with the supported emulator before upload
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-user
          python3 -u scripts/smoke.py
      - name: Upload verified firmware
        id: firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.builder.outputs.version }}-device-${{ inputs.proxy }}-${{ inputs.rootfs_mb }}MiB-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            smoke.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
