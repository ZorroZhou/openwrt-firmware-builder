name: Refresh version menu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read official release catalog and generate menu
        run: python3 scripts/sync_versions.py --output-dir catalog-update
      - uses: actions/upload-artifact@v4
        with:
          name: official-version-menu
          path: catalog-update/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
